<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Generator</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      text-align: center;
      width: 75vw;
      max-width: 900px;
      padding: 20px;
    }

    h1 {
      font-size: clamp(1.6rem, 2.5vw, 2.5rem);
      margin-bottom: 1rem;
      color: #1f2937;
    }

    #quote {
      font-size: clamp(1.1rem, 2vw, 1.8rem);
      font-weight: 400;
      line-height: 1.5;
      margin: 20px 0;
      min-height: 3em; /* reserve space to avoid layout jump */
    }

    button {
      padding: 12px 24px;
      font-size: 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:active {
      transform: scale(0.97);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Quote++</h1>

    <div id="quote">Click the button to load a quote.</div>

    <button id="getQuoteBtn">Get Quote</button>
  </div>

  <script>
    async function fetchQuote() {
      const quoteBox = document.getElementById('quote');
      quoteBox.textContent = "Loading...";

      try {
        const response = await fetch("https://quote.cs260.click");
        const data = await response.json();
        quoteBox.textContent = data.trim();
      } catch (err) {
        quoteBox.textContent = "Failed to load quote. Please try again.";
        console.error(err);
      }
    }

    document.getElementById('getQuoteBtn').addEventListener('click', fetchQuote);
  </script>
</body>
</html>
